name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        working-directory: polish-mono
        run: npm ci

      - name: Typecheck declarations
        working-directory: polish-mono
        run: npm run typecheck

      - name: Run test suite
        working-directory: polish-mono
        run: npm test

      - name: Pack smoke test (tarball install + CLI run)
        working-directory: polish-mono
        run: |
          set -e
          tarball="$(npm pack --silent)"
          mkdir -p "$RUNNER_TEMP/unpacked"
          tar -xzf "$tarball" -C "$RUNNER_TEMP/unpacked"
          pkg="$RUNNER_TEMP/unpacked/package"
          node "$pkg/bin/polish.mjs" --help > /dev/null
          # The demo project is intentionally flawed, so check exits 1 —
          # assert the report output instead of the exit code.
          node "$pkg/bin/polish.mjs" check "$GITHUB_WORKSPACE/examples/walkthrough/demo-project" --summary | grep -q "Token Health Check"
          echo "Pack smoke OK"

  publish:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - name: Verify tag matches package version
        working-directory: polish-mono
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          version="$(node -p "require('./package.json').version")"
          if [ "$tag" != "v$version" ]; then
            echo "Tag $tag does not match package version v$version"
            exit 1
          fi

      - name: Publish to npm (idempotent — skips already-published versions)
        working-directory: polish-mono
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          version="$(node -p "require('./package.json').version")"
          if npm view "polish-design-tokens@$version" version > /dev/null 2>&1; then
            echo "polish-design-tokens@$version is already published — skipping npm publish"
          else
            npm publish --access public
          fi

      - name: Create GitHub release (idempotent — skips existing releases)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists — skipping"
          else
            gh release create "$GITHUB_REF_NAME" --generate-notes
          fi
