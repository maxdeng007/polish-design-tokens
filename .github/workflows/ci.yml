name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        node-version: [18, 20, 22]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        working-directory: polish-mono
        run: npm ci

      - name: Typecheck declarations
        working-directory: polish-mono
        run: npm run typecheck

      - name: Run test suite
        working-directory: polish-mono
        run: npm test

      - name: Run pipeline on demo project
        working-directory: polish-mono
        run: |
          node -e "
          import('./src/index.js').then(async (m) => {
            const { graph, findings, plan, patches } = m.runPipeline('../examples/walkthrough/demo-project');
            if (findings.length < 4) {
              console.error('Expected at least 4 findings, got ' + findings.length);
              process.exit(1);
            }
            if (patches.length < 2) {
              console.error('Expected at least 2 patches, got ' + patches.length);
              process.exit(1);
            }
            console.log('Pipeline OK: ' + findings.length + ' findings, ' + patches.length + ' patches');
          });
          "

      - name: Pack smoke test (tarball install + CLI run)
        working-directory: polish-mono
        run: |
          set -e
          tarball="$(npm pack --silent)"
          mkdir -p "$RUNNER_TEMP/unpacked"
          tar -xzf "$tarball" -C "$RUNNER_TEMP/unpacked"
          pkg="$RUNNER_TEMP/unpacked/package"
          node "$pkg/bin/polish.mjs" --help > /dev/null
          # The demo project is intentionally flawed, so check exits 1 —
          # assert the report output instead of the exit code.
          node "$pkg/bin/polish.mjs" check "$GITHUB_WORKSPACE/examples/walkthrough/demo-project" --summary | grep -q "Token Health Check"
          echo "Pack smoke OK"
