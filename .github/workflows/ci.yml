name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        node-version: [18, 20, 22]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        working-directory: polish-mono
        run: npm ci

      - name: Typecheck declarations
        working-directory: polish-mono
        run: npx tsc

      - name: Run test suite
        working-directory: polish-mono
        run: node --test test/*.test.js

      - name: Run pipeline on demo project
        working-directory: polish-mono
        run: |
          node -e "
          import('./src/index.js').then(async (m) => {
            const { graph, findings, plan, patches } = m.runPipeline('../examples/walkthrough/demo-project');
            if (findings.length < 4) {
              console.error('Expected at least 4 findings, got ' + findings.length);
              process.exit(1);
            }
            if (patches.length < 2) {
              console.error('Expected at least 2 patches, got ' + patches.length);
              process.exit(1);
            }
            console.log('Pipeline OK: ' + findings.length + ' findings, ' + patches.length + ' patches');
          });
          "

      - name: Pack smoke test (tarball install + exports + MCP handshake + CLI)
        working-directory: polish-mono
        run: |
          set -e
          tarball="$(npm pack --silent)"
          prefix="$RUNNER_TEMP/smoke"
          # Install the tarball the way a real user would
          npm install --silent "$tarball" --prefix "$prefix"
          pkgdir="$prefix/node_modules/polish-design-tokens"

          # 1. Every exported subpath (root + 12 subpaths) imports from the installed package
          (cd "$prefix" && node -e "
            (async () => {
              for (const sub of ['', 'scan', 'cross', 'parse', 'measure', 'diff', 'confirm', 'apply', 'plan', 'wizard', 'report', 'mcp', 'rollback']) {
                await import('polish-design-tokens' + (sub ? '/' + sub : ''));
              }
              console.log('All 13 export subpaths import OK');
            })().catch((e) => { console.error(e); process.exit(1); });
          ")

          # 2. MCP handshake: initialize → tools/list → tools/call
          printf '%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{}}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/list"}' \
            "{\"jsonrpc\":\"2.0\",\"id\":3,\"method\":\"tools/call\",\"params\":{\"name\":\"polish_audit\",\"arguments\":{\"target\":\"$GITHUB_WORKSPACE/examples/walkthrough/demo-project\"}}}" \
            | node "$pkgdir/src/mcp-server.js" > "$prefix/mcp.out"
          node -e "
            const fs = require('fs');
            const lines = fs.readFileSync('$prefix/mcp.out', 'utf8').trim().split('\n').map((l) => JSON.parse(l));
            if (!lines.find((m) => m.id === 1).result.serverInfo) { console.error('initialize did not return serverInfo'); process.exit(1); }
            const tools = lines.find((m) => m.id === 2).result.tools;
            if (tools.length !== 9) { console.error('Expected 9 tools, got ' + tools.length); process.exit(1); }
            for (const t of tools) {
              if (!t.outputSchema) { console.error('Tool ' + t.name + ' missing outputSchema'); process.exit(1); }
            }
            const call = lines.find((m) => m.id === 3).result;
            if (!call.structuredContent || !call.structuredContent.findings) { console.error('tools/call missing structuredContent.findings'); process.exit(1); }
            console.log('MCP handshake OK: 9 tools, outputSchema + structuredContent present');
          "

          # 3. CLI from the installed package (demo project is intentionally flawed,
          #    so check exits 1 — assert the report output instead of the exit code)
          node "$pkgdir/bin/polish.mjs" --help > /dev/null
          node "$pkgdir/bin/polish.mjs" check "$GITHUB_WORKSPACE/examples/walkthrough/demo-project" --summary | grep -q "Token Health Check"
          echo "Pack smoke OK"
