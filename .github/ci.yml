name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run test suite
        working-directory: polish-mono
        run: node --test test/

      - name: Run pipeline on demo project
        working-directory: polish-mono
        run: |
          node -e "
          import('./src/index.js').then(async (m) => {
            const { graph, findings, plan, patches } = m.runPipeline('../examples/walkthrough/demo-project');
            if (findings.length < 4) {
              console.error('Expected at least 4 findings, got ' + findings.length);
              process.exit(1);
            }
            if (patches.length < 2) {
              console.error('Expected at least 2 patches, got ' + patches.length);
              process.exit(1);
            }
            console.log('Pipeline OK: ' + findings.length + ' findings, ' + patches.length + ' patches');
          });
          "
